# ==========================================================
# Configurações Locais (Desenvolvimento) - Loja Alcateia API
# ==========================================================
spring.application.name=ecpelotas-loja-api
server.port=${PORT:7996}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# PostgreSQL Local (Docker porta 5434)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5434/ecpelotas_loja_local}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:loja_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:loja_pass}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Segurança, CORS & Cookies
security.jwt.secret=${JWT_SECRET:ecpelotas-loja-alcateia-dev-jwt-secret-1908-pelotas-local}
security.jwt.expires-in=${JWT_EXPIRES_IN:1h}
frontend.url=${FRONTEND_URL:http://localhost:7995}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:7995,http://localhost:3000}

app.cookie.domain=${COOKIE_DOMAIN:}
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Storage
storage.provider=${STORAGE_PROVIDER:firebase}
firebase.project-id=${FIREBASE_PROJECT_ID:ecpelotas-loja}
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:ecpelotas-loja.firebasestorage.app}
firebase.credentials-base64=${FIREBASE_CREDENTIALS_BASE64:}

# Cache Caffeine
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# Integração S2S com o Portal E.C. Pelotas
app.portal.api-url=${PORTAL_API_URL:http://localhost:7998}
app.portal.internal-api-key=${PORTAL_INTERNAL_API_KEY:}
app.portal.readonly-db.url=${PORTAL_READONLY_DB_URL:}
app.portal.readonly-db.username=${PORTAL_READONLY_DB_USERNAME:}
app.portal.readonly-db.password=${PORTAL_READONLY_DB_PASSWORD:}
