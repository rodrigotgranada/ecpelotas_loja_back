services:
  postgres:
    image: postgres:17-alpine
    container_name: ecpelotas_loja_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecpelotas_loja_local}
      POSTGRES_USER: ${POSTGRES_USER:-loja_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loja_pass}
    ports:
      # Porta 5434 no host para rodar em paralelo com o Postgres do Portal (5433)
      - "5434:5432"
    volumes:
      - ecpelotas_loja_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loja_user} -d ${POSTGRES_DB:-ecpelotas_loja_local}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecpelotas_loja_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-7996}:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ecpelotas_loja_local}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-loja_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-loja_pass}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      APP_STAGE: LOCAL
      JWT_SECRET: ${JWT_SECRET:-ecpelotas-loja-alcateia-dev-jwt-secret-1908-pelotas-local}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:7995}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:7995,http://localhost:3000}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-firebase}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-ecpelotas-loja}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-ecpelotas-loja.firebasestorage.app}
      FIREBASE_CREDENTIALS_BASE64: ${FIREBASE_CREDENTIALS_BASE64:-}

volumes:
  ecpelotas_loja_pgdata:
    driver: local
